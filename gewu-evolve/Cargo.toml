[package]
name = "gewu-evolve"
version = "0.1.0"
edition = "2024"

[dependencies]
gewu-core = { path = "../gewu-core" }
gewu-graph = { path = "../gewu-graph" }
gewu-experience = { path = "../gewu-experience" }
gewu-providers = { path = "../gewu-providers" }
gewu-tools = { path = "../gewu-tools" }
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "2.0"
schemars = "0.8"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
futures = "0.3"
regex = "1.0"

[dev-dependencies]
tokio-test = "0.4"
anyhow = "1.0"
tempfile = "3.10"
