[package]
name = "gewu-graph"
version = "0.1.0"
edition = "2024"
description = "Directed state-graph execution engine with conditional edges and subgraph support"

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1"
futures = "0.3"
thiserror = "2.0"
async-stream = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
gewu-core = { path = "../gewu-core" }
schemars = "0.8"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tokio-test = "0.4"
tokio-stream = "0.1"
anyhow = "1.0"
[lints]
workspace = true
