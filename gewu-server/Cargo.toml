[package]
name = "gewu-server"
version = "0.1.1"
edition = "2024"

[dependencies]
gewu-core = { path = "../gewu-core" }
gewu-providers = { path = "../gewu-providers" }
gewu-protocol = { path = "../gewu-protocol" }
gewu-tools = { path = "../gewu-tools" }
gewu-storage = { path = "../gewu-storage" }
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonschema = { version = "0.46", default-features = false }
reqwest = { version = "0.12", features = ["stream"] }
mime_guess = "2"
url = "2"
sha2 = "0.10"
hex = "0.4"
ring = "0.17"
similar = "2.7"
percent-encoding = "2"
json-strip-comments = "3.1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = "0.3"
dotenvy = "0.15"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-native-tls"] }
uuid = { version = "1.10", features = ["v4"] }
dirs = "6.0.0"
futures = "0.3.32"
schemars = "0.8"
atty = "0.2"
ignore = "0.4"
tokio-tungstenite = "0.28"
tempfile = "3.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
async-stream = "0.3.6"
image = { version = "0.25.10", default-features = false, features = ["png"] }
