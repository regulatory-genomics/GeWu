<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GeWu login</title>
    <style>
      body {
        font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0e1116;
        color: #e6e8eb;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .card {
        background: #161a22;
        border: 1px solid #2a2f3a;
        border-radius: 8px;
        padding: 24px;
        min-width: 320px;
        max-width: 90vw;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
      }
      h1 {
        margin: 0 0 12px 0;
        font-size: 16px;
        font-weight: 600;
      }
      label {
        display: block;
        font-size: 12px;
        color: #9aa3ad;
        margin-bottom: 4px;
      }
      input[type="password"] {
        width: 100%;
        padding: 8px 10px;
        background: #0e1116;
        color: #e6e8eb;
        border: 1px solid #2a2f3a;
        border-radius: 4px;
        font: inherit;
        box-sizing: border-box;
      }
      button {
        margin-top: 12px;
        width: 100%;
        padding: 8px 10px;
        background: #2563eb;
        color: white;
        border: 0;
        border-radius: 4px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        background: #1e3a8a;
        cursor: wait;
      }
      .error {
        margin-top: 8px;
        color: #f87171;
        font-size: 12px;
        min-height: 1em;
      }
    </style>
  </head>
  <body>
    <form class="card" id="login-form" autocomplete="off">
      <h1>GeWu</h1>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autofocus required />
      <button id="submit" type="submit">Sign in</button>
      <div class="error" id="error"></div>
    </form>
    <script>
      const form = document.getElementById("login-form");
      const submit = document.getElementById("submit");
      const errorEl = document.getElementById("error");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorEl.textContent = "";
        submit.disabled = true;
        try {
          const res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: form.password.value }),
            credentials: "same-origin",
          });
          if (res.ok) {
            window.location.href = "/";
            return;
          }
          if (res.status === 401) {
            errorEl.textContent = "Wrong password.";
          } else {
            errorEl.textContent = `Login failed: ${res.status}`;
          }
        } catch (err) {
          errorEl.textContent = `Network error: ${err}`;
        } finally {
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
