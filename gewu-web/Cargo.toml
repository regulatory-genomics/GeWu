[package]
name = "gewu-web"
version = "0.1.0"
edition = "2021"
description = "GeWu Web UI - Browser-based interface for the GeWu agent framework"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
async-trait = "0.1"
tokio-stream = { version = "0.1", features = ["sync"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
hex = "0.4"
dotenvy = "0.15"
dirs = "6"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

gewu-core = { path = "../gewu-core" }
gewu-providers = { path = "../gewu-providers" }
gewu-tools = { path = "../gewu-tools" }
gewu-storage = { path = "../gewu-storage" }
gewu-runtime = { path = "../gewu-runtime" }
gewu-cli = { path = "../gewu-cli" }
gewu-canvas = { path = "../gewu-canvas" }

sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-native-tls"] }

[[bin]]
name = "gewu-web"
path = "src/main.rs"
