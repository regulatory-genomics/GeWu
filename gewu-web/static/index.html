<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeWu Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/vendor/tachyon-canvas/tachyon-canvas.css" />
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header id="header">
            <button id="toggle-sidebar" type="button" title="Toggle Sidebar">☰</button>
            <h1>GeWu</h1>
            <div id="header-info">
                <div class="header-info-item">
                    <span class="label">Model:</span>
                    <span id="model-name">-</span>
                </div>
                <div class="header-info-item">
                    <span class="label">Endpoint:</span>
                    <span id="endpoint-name">-</span>
                </div>
            </div>
            <div id="status-indicator"><span class="dot"></span><span id="status-text">Ready</span></div>
        </header>

        <!-- Sidebar -->
        <aside id="sidebar">
        <div id="agent-selector-container">
            <select id="agent-selector"></select>
        </div>
            <div class="sidebar-content">
                <div class="session-list" id="session-list"></div>
            </div>
            <div class="sidebar-footer">
                <button id="add-project-btn" type="button">
                    <span>＋</span>
                    <span>Add Project</span>
                </button>
                <button id="new-session-btn" type="button">
                    <span>+</span>
                    <span>New Session</span>
                </button>
            </div>
        </aside>

        <!-- Resize Handle -->
        <div id="sidebar-handle"></div>

        <!-- Chat Panel -->
        <main id="chat-panel">
            <div id="chat-container"></div>
            <div id="error-container"></div>
        </main>

        <aside id="trace-panel">
            <div id="trace-header">Work Panel</div>
            <div class="work-tabs">
                <button type="button" class="work-tab active" data-work-tab="timeline">Timeline</button>
                <button type="button" class="work-tab" data-work-tab="todo">Todo</button>
                <button type="button" class="work-tab" data-work-tab="tasks">Tasks</button>
                <button type="button" class="work-tab" data-work-tab="trace">Trace</button>
            </div>
            <div id="trace-container">
                <div class="trace-empty">Select a session to inspect its work timeline.</div>
            </div>
        </aside>

        <!-- Input Area -->
        <div id="input-area">
            <textarea id="message-input" placeholder="Type your message..." rows="1"></textarea>
            <button id="send-btn" type="button">Send</button>
        </div>
    </div>

    <!-- Canvas overlay container.
         Mounted lazily by canvas.js when a canvas:open event arrives.
         Sits above the regular chat layout but is hidden by default. -->
    <div id="canvas-overlay" class="canvas-overlay" hidden></div>

    <div id="project-picker-modal" class="modal-backdrop" hidden>
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="project-picker-title">
            <div class="modal-header">
                <div>
                    <div id="project-picker-title" class="modal-title">Add Project</div>
                    <div id="project-picker-current" class="modal-subtitle">Choose a directory from this machine.</div>
                </div>
                <button id="project-picker-close" class="modal-close" type="button" aria-label="Close">×</button>
            </div>
            <label class="modal-field">
                <span>Project name</span>
                <input id="project-name-input" type="text" placeholder="Project name" />
            </label>
            <label class="modal-field">
                <span>Selected directory</span>
                <input id="project-path-input" type="text" readonly placeholder="Select a directory below" />
            </label>
            <div id="project-directory-list" class="directory-list"></div>
            <div class="modal-actions">
                <button id="project-picker-cancel" type="button" class="modal-secondary">Cancel</button>
                <button id="project-picker-create" type="button" class="modal-primary">Create Project</button>
            </div>
        </div>
    </div>

    <script src="/canvas.js"></script>
    <!-- tachyon-canvas IIFE bundle: registers a "genome" renderer with
         window.canvasController on load. Shipped from /tachyon-canvas/dist/. -->
    <script src="/vendor/tachyon-canvas/tachyon-canvas.iife.js"></script>
    <script src="/app.js"></script>
</body>
</html>
