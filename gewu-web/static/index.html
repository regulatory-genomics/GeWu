<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeWu Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <style>
        :root {
            --sidebar-width: 220px;
            --sidebar-min: 180px;
            --sidebar-max: 350px;
            --header-height: 48px;
            --input-height: 80px;
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border-color: #30363d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-orange: #8b6914;
            --accent-red: #f85149;
            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 8px;
            --transition-fast: 0.15s ease;
            --transition-smooth: 0.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text-primary);
        }

        #app {
            display: grid;
            grid-template-columns: var(--sidebar-width) 1fr;
            grid-template-rows: var(--header-height) 1fr var(--input-height);
            grid-template-areas:
                "header header"
                "sidebar chat"
                "input input";
            height: 100vh;
            width: 100vw;
        }

        /* Header */
        #header {
            grid-area: header;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 0 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }

        #toggle-sidebar {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            transition: background var(--transition-fast);
        }
        #toggle-sidebar:hover { background: var(--bg-tertiary); }

        #header h1 {
            color: var(--accent-blue);
            font-size: 18px;
            font-weight: 600;
        }

        #header-info {
            display: flex;
            gap: 20px;
            margin-left: auto;
            font-size: 12px;
        }

        .header-info-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-info-item .label {
            color: var(--text-muted);
        }

        #status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        #status-indicator .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
        }

        #status-indicator.loading .dot {
            background: var(--accent-orange);
            animation: pulse 1s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* Sidebar */
        #sidebar {
            grid-area: sidebar;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            overflow: hidden;
            transition: width var(--transition-smooth);
        }

        #sidebar.collapsed {
            width: 0 !important;
            border-right: none;
        }

        #sidebar.collapsed .sidebar-content,
        #sidebar.collapsed .sidebar-footer {
            display: none;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .session-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .session-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: background var(--transition-fast);
            overflow: hidden;
        }

        .session-item:hover { background: var(--bg-tertiary); }
        .session-item.active { background: var(--border-color); }

        .session-icon {
            font-size: 16px;
            flex-shrink: 0;
        }

        .session-name {
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .session-delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px 6px;
            font-size: 12px;
            border-radius: var(--radius-sm);
            opacity: 0;
            transition: opacity var(--transition-fast), background var(--transition-fast);
        }
        .session-item:hover .session-delete-btn {
            opacity: 1;
        }
        .session-delete-btn:hover {
            background: var(--accent-red);
            color: white;
        }

        .sidebar-footer {
            padding: 8px;
            border-top: 1px solid var(--border-color);
        }

        #new-session-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 13px;
            transition: background var(--transition-fast);
        }
        #new-session-btn:hover { background: var(--border-color); }

        /* Agent Selector */
        #agent-selector-container {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
            align-items: center;
        }

        #agent-selector {
            flex: 1;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 8px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            cursor: pointer;
        }
        #agent-selector:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        /* Resize Handle */
        #sidebar-handle {
            position: absolute;
            left: var(--sidebar-width);
            top: var(--header-height);
            bottom: var(--input-height);
            width: 4px;
            cursor: col-resize;
            background: transparent;
            transition: background var(--transition-fast);
            z-index: 50;
        }

        #sidebar-handle:hover,
        #sidebar-handle.dragging {
            background: var(--accent-blue);
        }

        /* Chat Area */
        #chat-panel {
            grid-area: chat;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            overflow: hidden;
            position: relative;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .message {
            margin-bottom: 8px;
            padding: 8px 12px;
            border-radius: var(--radius-lg);
            max-width: 85%;
        }

        .message.user {
            background: #1f6feb15;
            border-left: 3px solid var(--accent-blue);
            margin-left: auto;
        }

        .message.assistant {
            background: #23863615;
            border-left: 3px solid var(--accent-green);
        }

        .message .role {
            font-weight: 600;
            font-size: 11px;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .message.user .role { color: var(--accent-blue); }
        .message.assistant .role { color: var(--accent-green); }

        .message .content {
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.4;
        }

        /* Markdown rendered content */
        .message .content h1 { font-size: 1.2em; margin: 0.2em 0; }
        .message .content h2 { font-size: 1.1em; margin: 0.2em 0; }
        .message .content h3 { font-size: 1em; margin: 0.2em 0; }
        .message .content p { margin-top: 0.15em; }
        .message .content p + p { margin-top: 0.15em; }
        .message .content code {
            background: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            font-family: monospace;
            font-size: 0.9em;
        }
        .message .content pre {
            background: var(--bg-tertiary);
            padding: 10px;
            border-radius: var(--radius-md);
            overflow-x: auto;
            margin: 0.1em 0;
        }
        .message .content pre code {
            background: none;
            padding: 0;
        }
        .message .content ul,
        .message .content ol { margin: 0.1em 0; padding-left: 1.5em; }
        .message .content li { margin: 0.15em 0; }
        .message .content blockquote {
            border-left: 3px solid var(--text-muted);
            margin: 0.1em 0;
            padding-left: 1em;
            color: var(--text-secondary);
        }
        .message .content a { color: var(--accent-blue); }
        .message .content a:hover { text-decoration: underline; }
        .message .content table {
            border-collapse: collapse;
            margin: 0.1em 0;
        }
        .message .content th,
        .message .content td {
            border: 1px solid var(--border-color);
            padding: 4px 8px;
        }
        .message .content th { background: var(--bg-tertiary); }
        .message .content img {
            max-width: 100%;
            border-radius: var(--radius-md);
        }
        .message .content hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 0.5em 0;
        }

        /* Tool Calls (inline in chat) */
        .tool-call {
            margin-bottom: 16px;
            background: #3d2a1e10;
            border: 1px solid #8b691430;
            border-radius: var(--radius-md);
            overflow: hidden;
            font-size: 12px;
        }

        .tool-call summary {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            list-style: none;
        }

        .tool-call summary::-webkit-details-marker { display: none; }

        .tool-call summary:hover { background: #3d2a1e20; }

        .tool-icon {
            color: var(--accent-orange);
            font-size: 11px;
        }

        .tool-status {
            margin-left: auto;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: normal;
        }

        .tool-status.running {
            background: var(--accent-orange);
            color: white;
        }

        .tool-status.done {
            background: var(--accent-green);
            color: white;
        }

        .tool-body {
            padding: 8px 12px;
            border-top: 1px solid #8b691420;
        }

        .tool-field {
            margin-bottom: 8px;
        }

        .tool-field:last-child { margin-bottom: 0; }

        .tool-field-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .tool-field-content {
            background: var(--bg-primary);
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 150px;
            overflow-y: auto;
        }

        /* Reasoning message (collapsible) */
        .reasoning-message {
            margin-bottom: 8px;
            background: #8b949e10;
            border-left: 3px solid var(--text-secondary);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        .reasoning-message summary {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
            list-style: none;
        }

        .reasoning-message summary::-webkit-details-marker { display: none; }

        .reasoning-message summary .icon {
            font-size: 10px;
            transition: transform 0.15s ease;
        }

        .reasoning-message[open] summary .icon {
            transform: rotate(90deg);
        }

        .reasoning-message .reasoning-content {
            padding: 6px 10px;
            font-style: italic;
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* Input Area */
        #input-area {
            grid-area: input;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
        }

        #message-input {
            flex: 1;
            padding: 12px 14px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            resize: none;
            line-height: 1.4;
            max-height: 120px;
        }

        #message-input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        #message-input::placeholder { color: var(--text-muted); }

        #send-btn {
            padding: 12px 24px;
            background: var(--accent-green);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background var(--transition-fast);
        }

        #send-btn:hover { background: #2ea043; }
        #send-btn:disabled {
            background: var(--bg-tertiary);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        /* Error */
        #error-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 8px 16px;
            z-index: 10;
        }

        .error {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8514920;
            color: var(--accent-red);
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-size: 13px;
            border-left: 3px solid var(--accent-red);
        }

        .error-close {
            background: none;
            border: none;
            color: var(--accent-red);
            font-size: 18px;
            cursor: pointer;
            padding: 0 0 0 8px;
            line-height: 1;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header id="header">
            <button id="toggle-sidebar" title="Toggle Sidebar">☰</button>
            <h1>GeWu</h1>
            <div id="header-info">
                <div class="header-info-item">
                    <span class="label">Model:</span>
                    <span id="model-name">-</span>
                </div>
                <div class="header-info-item">
                    <span class="label">Endpoint:</span>
                    <span id="endpoint-name">-</span>
                </div>
            </div>
            <div id="status-indicator"><span class="dot"></span><span id="status-text">Ready</span></div>
        </header>

        <!-- Sidebar -->
        <aside id="sidebar">
        <div id="agent-selector-container">
            <select id="agent-selector"></select>
        </div>
            <div class="sidebar-content">
                <div class="session-list" id="session-list"></div>
            </div>
            <div class="sidebar-footer">
                <button id="new-session-btn">
                    <span>+</span>
                    <span>New Session</span>
                </button>
            </div>
        </aside>

        <!-- Resize Handle -->
        <div id="sidebar-handle"></div>

        <!-- Chat Panel -->
        <main id="chat-panel">
            <div id="chat-container"></div>
            <div id="error-container"></div>
        </main>

        <!-- Input Area -->
        <div id="input-area">
            <textarea id="message-input" placeholder="Type your message..." rows="1"></textarea>
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        // State
        const state = {
            sidebar: { width: 220, collapsed: false },
            sessions: [],
            currentSession: null
        };

        // DOM Elements
        const sidebar = document.getElementById('sidebar');
        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const sessionList = document.getElementById('session-list');
        const errorContainer = document.getElementById('error-container');
        const modelNameEl = document.getElementById('model-name');
        const endpointNameEl = document.getElementById('endpoint-name');
        const statusIndicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');
        const toggleSidebarBtn = document.getElementById('toggle-sidebar');
        const newSessionBtn = document.getElementById('new-session-btn');
        const sidebarHandle = document.getElementById('sidebar-handle');
        const agentSelector = document.getElementById('agent-selector');

        let token = '';
        let isLoading = false;
        let activeToolCallEl = null;
        let currentMarkdownBuffer = '';

        // Configure marked
        marked.setOptions({
            breaks: true,
            gfm: true
        });

        // URL params
        const urlParams = new URLSearchParams(window.location.search);
        token = urlParams.get('token') || '';

        // Load persisted state
        function loadState() {
            try {
                const saved = localStorage.getItem('gewu_state');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed.sidebar) state.sidebar = parsed.sidebar;
                    if (parsed.sessions) state.sessions = parsed.sessions;
                }
            } catch (e) {}
        }

        // Save state
        function saveState() {
            try {
                localStorage.setItem('gewu_state', JSON.stringify({
                    sidebar: state.sidebar,
                    sessions: state.sessions
                }));
            } catch (e) {}
        }

        // Apply state to UI
        function applyState() {
            document.documentElement.style.setProperty('--sidebar-width', state.sidebar.width + 'px');
            if (state.sidebar.collapsed) {
                sidebar.classList.add('collapsed');
            }
            updateHandles();
        }

        // Update resize handle positions
        function updateHandles() {
            const sidebarWidth = state.sidebar.collapsed ? 48 : state.sidebar.width;
            sidebarHandle.style.left = sidebarWidth + 'px';
            sidebarHandle.style.display = state.sidebar.collapsed ? 'none' : 'block';
        }

        // Resize Handle Logic
        let isResizing = false;
        let startX = 0;
        let startWidth = 0;

        function startResize(e) {
            e.preventDefault();
            isResizing = true;
            startX = e.clientX;
            startWidth = state.sidebar.collapsed ? 48 : state.sidebar.width;

            document.body.style.userSelect = 'none';
            document.body.style.overflow = 'hidden';
            sidebarHandle.classList.add('dragging');

            document.addEventListener('mousemove', onResize);
            document.addEventListener('mouseup', stopResize);
        }

        function onResize(e) {
            if (!isResizing) return;

            const delta = e.clientX - startX;
            let newWidth = startWidth + delta;

            // Collapse threshold
            if (newWidth < 100) {
                state.sidebar.collapsed = true;
                newWidth = 48;
            } else {
                state.sidebar.collapsed = false;
                newWidth = Math.min(Math.max(newWidth, 180), 350);
            }

            state.sidebar.width = newWidth;
            document.documentElement.style.setProperty('--sidebar-width', newWidth + 'px');
            sidebar.classList.toggle('collapsed', state.sidebar.collapsed);
            updateHandles();
        }

        function stopResize() {
            isResizing = false;
            document.body.style.userSelect = '';
            document.body.style.overflow = '';
            sidebarHandle.classList.remove('dragging');
            document.removeEventListener('mousemove', onResize);
            document.removeEventListener('mouseup', stopResize);
            saveState();
        }

        // Event Listeners for Resize Handle
        sidebarHandle.addEventListener('mousedown', startResize);

        // Toggle Sidebar
        toggleSidebarBtn.addEventListener('click', () => {
            state.sidebar.collapsed = !state.sidebar.collapsed;
            if (state.sidebar.collapsed) {
                sidebar.classList.add('collapsed');
                sidebarHandle.style.display = 'none';
            } else {
                sidebar.classList.remove('collapsed');
                sidebarHandle.style.display = 'block';
            }
            updateHandles();
            saveState();
        });

        // API Functions
        async function loadServerInfo() {
            try {
                const resp = await fetch(`/api/info?token=${encodeURIComponent(token)}`);
                const data = await resp.json();
                modelNameEl.textContent = data.model || 'unknown';
                endpointNameEl.textContent = data.endpoint || 'unknown';
            } catch (e) {
                modelNameEl.textContent = 'error';
                endpointNameEl.textContent = 'error';
            }
        }

        function setStatus(text, loading = false) {
            statusText.textContent = text;
            statusIndicator.className = loading ? 'loading' : '';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderMarkdown(text) {
            const html = marked.parse(text);
            return DOMPurify.sanitize(html);
        }

        function showError(msg) {
            errorContainer.innerHTML = `
                <div class="error">
                    <span>${escapeHtml(msg)}</span>
                    <button class="error-close" onclick="closeError()">×</button>
                </div>
            `;
            errorContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function closeError() {
            errorContainer.innerHTML = '';
        }

        function clearChat() {
            chatContainer.innerHTML = '';
        }

        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            const renderedContent = (role === 'user' || role === 'assistant') ? renderMarkdown(content) : escapeHtml(content);
            div.innerHTML = `<div class="role">${role}</div><div class="content">${renderedContent}</div>`;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Session Management
        function renderSessions() {
            sessionList.innerHTML = '';
            state.sessions.forEach(session => {
                const item = document.createElement('div');
                item.className = 'session-item' + (session.id === state.currentSession?.id ? ' active' : '');
                item.innerHTML = `
                    <span class="session-icon">💬</span>
                    <span class="session-name" title="${escapeHtml(session.agent_type)}">${escapeHtml(session.id.substring(0, 8))}</span>
                    <button class="session-delete-btn" title="Delete session">✕</button>
                `;
                item.addEventListener('click', (e) => {
                    if (e.target.classList.contains('session-delete-btn')) {
                        e.stopPropagation();
                        deleteSession(session.id);
                    } else {
                        switchSession(session);
                    }
                });
                sessionList.appendChild(item);
            });
        }

        async function switchSession(session) {
            if (state.currentSession?.id === session.id) return;
            state.currentSession = session;
            agentSelector.value = session.agent_type;
            clearChat();
            renderSessions();
            setStatus('Loading...', true);

            // Load messages for this session
            try {
                const resp = await fetch(`/api/sessions/${session.id}/messages?token=${encodeURIComponent(token)}`);
                if (resp.ok) {
                    const data = await resp.json();
                    if (data.messages && data.messages.length > 0) {
                        for (const msg of data.messages) {
                            renderMessage(msg);
                        }
                    } else {
                        addMessage('assistant', 'Session ready. How can I help you?');
                    }
                } else {
                    addMessage('assistant', 'Session ready. How can I help you?');
                }
            } catch (e) {
                addMessage('assistant', 'Session ready. How can I help you?');
            }

            renderSessions();
            setStatus('Ready');
        }

        function renderMessage(msg) {
            const div = document.createElement('div');
            div.className = `message ${msg.role}`;

            let content = '';
            if (msg.role === 'system') {
                content = escapeHtml(msg.content);
            } else if (msg.role === 'user') {
                if (Array.isArray(msg.content)) {
                    content = msg.content.map(part => {
                        if (part.type === 'text') return renderMarkdown(part.text);
                        return escapeHtml(JSON.stringify(part));
                    }).join('');
                } else {
                    content = renderMarkdown(msg.content || '');
                }
            } else if (msg.role === 'assistant') {
                content = renderMarkdown(msg.content || '');
                if (msg.tool_calls && msg.tool_calls.length > 0) {
                    content += '<div class="tool-calls-info">Tool calls: ' + msg.tool_calls.map(tc => tc.function.name).join(', ') + '</div>';
                }
            } else if (msg.role === 'tool') {
                content = `<span class="tool-label">[${msg.tool_name || 'tool'}]</span> ${escapeHtml(msg.content)}`;
            }

            div.innerHTML = `<div class="role">${msg.role}</div><div class="content">${content}</div>`;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function deleteSession(sessionId) {
            if (!confirm('Delete this session?')) return;
            try {
                const resp = await fetch(`/api/sessions/${sessionId}?token=${encodeURIComponent(token)}`, {
                    method: 'DELETE'
                });
                if (!resp.ok) throw new Error('Failed to delete');
                if (state.currentSession?.id === sessionId) {
                    state.currentSession = null;
                    clearChat();
                    const idx = state.sessions.findIndex(s => s.id === sessionId);
                    if (idx !== -1) state.sessions.splice(idx, 1);
                    if (state.sessions.length > 0) {
                        switchSession(state.sessions[0]);
                    }
                } else {
                    const idx = state.sessions.findIndex(s => s.id === sessionId);
                    if (idx !== -1) state.sessions.splice(idx, 1);
                }
                renderSessions();
                saveState();
            } catch (e) {
                showError('Failed to delete session: ' + e.message);
            }
        }

        async function createSession(agentType = 'general') {
            try {
                setStatus('Creating...', true);
                const resp = await fetch(`/api/sessions?token=${encodeURIComponent(token)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ agent_type: agentType })
                });
                const data = await resp.json();
                const session = data.session;
                state.currentSession = session;
                agentSelector.value = session.agent_type;
                state.sessions.unshift(session);
                if (state.sessions.length > 10) state.sessions.pop();
                clearChat();
                renderSessions();
                setStatus('Ready');
                saveState();
                return true;
            } catch (e) {
                showError('Failed to create session: ' + e.message);
                setStatus('Error');
                return false;
            }
        }

        async function switchAgent() {
            if (!state.currentSession) {
                showError('No active session');
                return;
            }
            const newAgentType = agentSelector.value;
            if (newAgentType === state.currentSession.agent_type) {
                return;
            }
            try {
                setStatus('Switching agent...', true);
                const resp = await fetch(`/api/sessions/${state.currentSession.id}/switch-agent?token=${encodeURIComponent(token)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ agent_type: newAgentType })
                });
                if (!resp.ok) {
                    throw new Error('Failed to switch agent');
                }
                const data = await resp.json();
                state.currentSession = data.session;
                const idx = state.sessions.findIndex(s => s.id === state.currentSession.id);
                if (idx !== -1) {
                    state.sessions[idx] = data.session;
                }
                renderSessions();
                saveState();
                addMessage('assistant', `Agent switched to ${newAgentType}. Memory preserved from previous agent.`);
                setStatus('Ready');
            } catch (e) {
                showError('Failed to switch agent: ' + e.message);
                setStatus('Error');
            }
        }

        // Tool Call Display (inline in chat)
        function createToolCall(toolName, input) {
            const details = document.createElement('details');
            details.className = 'tool-call';
            details.innerHTML = `
                <summary>
                    <span class="tool-icon">▼</span>
                    <span class="tool-name">${escapeHtml(toolName)}</span>
                    <span class="tool-status running">running...</span>
                </summary>
                <div class="tool-body">
                    <div class="tool-field">
                        <div class="tool-field-label">Input</div>
                        <div class="tool-field-content">${escapeHtml(input)}</div>
                    </div>
                    <div class="tool-field">
                        <div class="tool-field-label">Output</div>
                        <div class="tool-field-content tool-output"></div>
                    </div>
                </div>
            `;
            chatContainer.appendChild(details);
            details.open = true;
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return details;
        }

        function finishToolCall(details, output) {
            const summary = details.querySelector('summary');
            const status = summary.querySelector('.tool-status');
            status.className = 'tool-status done';
            status.textContent = 'done ✓';
            summary.querySelector('.tool-icon').textContent = '▶';
            details.querySelector('.tool-output').textContent = output;
            details.open = false;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Streaming Message Elements
        let currentAssistantDiv = null;
        let currentReasoningDiv = null;

        function createAssistantDiv() {
            const div = document.createElement('div');
            div.className = 'message assistant';
            div.innerHTML = `<div class="role">Assistant</div><div class="content"></div>`;
            chatContainer.appendChild(div);
            currentMarkdownBuffer = '';
            return div;
        }

        function createReasoningDiv() {
            const details = document.createElement('details');
            details.className = 'reasoning-message';
            details.innerHTML = `
                <summary><span class="icon">▶</span>Reasoning</summary>
                <div class="reasoning-content"></div>
            `;
            chatContainer.appendChild(details);
            return details;
        }

        function appendToDiv(div, role, text) {
            if (role === 'assistant') {
                currentMarkdownBuffer += text;
                const html = DOMPurify.sanitize(marked.parse(currentMarkdownBuffer));
                div.querySelector('.content').innerHTML = html;
            } else {
                div.querySelector('.reasoning-content').textContent += text;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // SSE Handler
        function handleSSEEvent(event) {
            switch (event.type) {
                case 'reasoning_delta':
                    if (!currentReasoningDiv) {
                        currentReasoningDiv = createReasoningDiv();
                    }
                    appendToDiv(currentReasoningDiv, 'reasoning', event.data.delta);
                    break;
                case 'content_delta':
                    if (!currentAssistantDiv) {
                        currentAssistantDiv = createAssistantDiv();
                    }
                    appendToDiv(currentAssistantDiv, 'assistant', event.data.delta);
                    break;
                case 'tool_start':
                    activeToolCallEl = createToolCall(event.data.tool, event.data.input);
                    break;
                case 'tool_finish':
                    if (activeToolCallEl) {
                        finishToolCall(activeToolCallEl, event.data.output);
                        activeToolCallEl = null;
                    }
                    break;
                case 'finish':
                    currentMarkdownBuffer = '';
                    if (currentReasoningDiv) {
                        currentReasoningDiv.open = false;
                        currentReasoningDiv = null;
                    }
                    if (currentAssistantDiv) {
                        currentAssistantDiv = null;
                    }
                    break;
                case 'error':
                    showError(event.data.error);
                    break;
            }
        }

        // Send Message
        async function sendMessage() {
            if (isLoading || !state.currentSession) return;

            const message = messageInput.value.trim();
            if (!message) return;

            isLoading = true;
            sendBtn.disabled = true;
            messageInput.value = '';
            setStatus('Thinking...', true);

            addMessage('user', message);

            currentAssistantDiv = null;
            currentReasoningDiv = null;

            try {
                const resp = await fetch(`/api/chat?token=${encodeURIComponent(token)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: state.currentSession.id, message })
                });

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const event = JSON.parse(line.slice(6));
                                handleSSEEvent(event);
                            } catch (e) {
                                console.error('Failed to parse SSE event:', e, 'line:', line);
                            }
                        }
                    }
                }
            } catch (e) {
                console.error('Fetch error:', e);
                showError('Connection error: ' + e.message);
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
                setStatus('Ready');
            }
        }

        // Event Listeners
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        newSessionBtn.addEventListener('click', async () => {
            if (await createSession()) {
                addMessage('assistant', 'Session ready. How can I help you?');
            }
        });

        agentSelector.addEventListener('change', switchAgent);

        // Window resize handler
        window.addEventListener('resize', updateHandles);

        function showTokenError(message) {
            chatContainer.innerHTML = `
                <div style="display: flex; align-items: center; justify-content: center; height: 100%; flex-direction: column; text-align: center; padding: 20px;">
                    <div style="color: var(--accent-red); margin-bottom: 16px;">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                    </div>
                    <h2 style="color: var(--accent-red); margin: 0 0 8px 0;">Access Denied</h2>
                    <p style="color: var(--text-secondary); margin: 0 0 16px 0;">${escapeHtml(message)}</p>
                    <p style="font-size: 12px; color: var(--text-muted); margin: 0;">Please provide a valid token to access this page</p>
                </div>
            `;
        }

        async function validateToken() {
            if (!token) {
                showTokenError("No token provided in URL");
                return false;
            }
            try {
                const resp = await fetch(`/api/validate?token=${encodeURIComponent(token)}`);
                if (!resp.ok) {
                    showTokenError("Invalid token");
                    return false;
                }
                return true;
            } catch (e) {
                showTokenError("Token validation failed");
                return false;
            }
        }

        // Initialize
        loadState();
        applyState();

        validateToken().then(valid => {
            if (!valid) return;
            loadServerInfo();
            renderSessions();
            if (state.currentSession) {
                switchSession(state.currentSession);
            } else {
                addMessage('assistant', 'Select a session or create a new one to start.');
            }
        });
    </script>
</body>
</html>
