[package]
name = "gewu"
version = "0.1.7"
edition = "2024"

[dependencies]
gewu-cli = { path = "../gewu-cli" }
gewu-client = { path = "../gewu-client" }
gewu-gui = { path = "../gewu-gui" }
gewu-server = { path = "../gewu-server" }
gewu-update = { path = "../gewu-update" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
futures = "0.3"
serde_json = "1"
tokio-tungstenite = "0.28"
