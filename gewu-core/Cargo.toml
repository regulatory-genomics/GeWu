[package]
name = "gewu-core"
version = "0.1.0"
edition = "2024"
description = "Core traits, types, and agent loop for the GeWu agent framework"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
dirs = "5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "2.0"
schemars = "0.8"
uuid = { version = "1.0", features = ["v4"] }
futures = "0.3.32"
async-stream = "0.3.6"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "migrate", "macros"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
gewu-providers = { path = "../gewu-providers" }
gewu-tools = { path = "../gewu-tools" }

[lints]
workspace = true
