[package]
name = "gewu-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "2.0"
schemars = "0.8"
uuid = { version = "1.0", features = ["v4"] }
futures = "0.3.32"
async-stream = "0.3.6"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-native-tls"] }

[dev-dependencies]
gewu-providers = { path = "../gewu-providers" }
gewu-tools = { path = "../gewu-tools" }
