[package]
name = "gewu-storage"
version = "0.1.0"
edition = "2024"
description = "SQLite-backed persistent memory, session, project, and task storage for GeWu"

[dependencies]
gewu-core = { path = "../gewu-core" }
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "migrate", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
