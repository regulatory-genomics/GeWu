[package]
name = "gewu-tools"
version = "0.1.0"
edition = "2024"

[dependencies]
gewu-core = { path = "../gewu-core" }
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
schemars = "0.8"
tokio = { version = "1", features = ["full"] }
glob = "0.3"
grep = "0.4"
ignore = "0.4"
mime_guess = "2.0"
reqwest = { version = "0.12", features = ["json", "stream", "cookies"] }
html2md = "0.2"
futures-util = "0.3"
tracing = "0.1"
base64 = "0.22"
regex = "1.0"
similar = "2.7"
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"
mockito = "1.4"
