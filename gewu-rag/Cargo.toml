[package]
name = "gewu-rag"
version = "0.1.0"
edition = "2024"
publish = false
description = "Retrieval-augmented generation pipeline with vector search for GeWu"

[dependencies]
gewu-core = { path = "../gewu-core" }
gewu-providers = { path = "../gewu-providers" }
gewu-storage = { path = "../gewu-storage" }
gewu-graph = { path = "../gewu-graph" }
qdrant-client = "1.16"
embed_anything = { git = "https://github.com/StarlightSearch/EmbedAnything", rev = "273bf9da0317cd5740b66f6c69de9000fa76049e" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
async-trait = "0.1"
schemars = "0.8"
glob = "0.3"
regex = "1"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
dirs = "6.0"
dotenvy = "0.15"

[dev-dependencies]
tokio-test = "0.4"
anyhow = "1.0"

[lints]
workspace = true
