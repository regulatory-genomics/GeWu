name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test workspace
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install plugin test dependencies
        run: |
          python -m pip install jsonschema
          npm --prefix gewu-gui/tests/browser ci
          npm --prefix gewu-gui/tests/browser exec -- playwright install --with-deps chromium

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check install script
        run: bash -n install.sh

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Test workspace
        run: bash scripts/check-plugin-host.sh --contracts --browser
