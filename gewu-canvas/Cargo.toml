[package]
name = "gewu-canvas"
version = "0.1.0"
edition = "2024"
description = "Generic agent-controllable canvas runtime for GeWu (kind-agnostic surface; genome canvas lives in tachyon-canvas)"

[dependencies]
gewu-core = { path = "../gewu-core" }
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
tokio = { version = "1", features = ["sync", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
thiserror = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "macros", "rt-multi-thread"] }

[lints]
workspace = true
