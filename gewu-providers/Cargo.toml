[package]
name = "gewu-providers"
version = "0.1.0"
edition = "2024"

[dependencies]
gewu-core = { path = "../gewu-core" }
anyhow = "1.0"
async-trait = "0.1"
bytes = "1.0"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
async-stream = "0.3.6"
schemars = "0.8"

[dev-dependencies]
schemars = "0.8"
