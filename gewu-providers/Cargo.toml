[package]
name = "gewu-providers"
version = "0.1.0"
edition = "2024"
description = "LLM provider implementations (OpenAI-compatible, replay, scripted) for GeWu"

[dependencies]
gewu-core = { path = "../gewu-core" }
anyhow = "1.0"
async-trait = "0.1"
bytes = "1.0"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
async-stream = "0.3.6"
sha2 = "0.10"
hex = "0.4"
parking_lot = "0.12"

[dev-dependencies]
schemars = "0.8"
tokio-test = "0.4"
tempfile = "3"

[lints]
workspace = true
