[package]
name = "gewu-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
gewu-client = { path = "../gewu-client" }
gewu-protocol = { path = "../gewu-protocol" }
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3.32"
pulldown-cmark = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tokio-tungstenite = "0.28"
