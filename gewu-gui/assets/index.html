<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#07090c">
  <title>GeWu · 格物</title>
  <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/jetbrains-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="app" class="app preload sidebar-collapsed">
    <div id="offline" class="banner hidden" role="status" aria-live="polite">
      <span id="offline-text">Disconnected</span>
      <button id="retry" class="banner-action" type="button">Retry now</button>
    </div>

    <div class="workspace">
      <div id="session-sidebar" class="session-sidebar-host" aria-label="Sessions by workspace"></div>

      <button id="sessions-expand" class="floating-brand-toggle" type="button" aria-label="Open sidebar" aria-controls="session-sidebar" aria-expanded="false">
        <span class="brand-mark floating-brand-mark" aria-hidden="true">
          <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><circle cx="12" cy="12" r="4.25"/><path d="M12 3.5v4.25M12 16.25v4.25M3.5 12h4.25M16.25 12h4.25"/></svg>
        </span>
        <span class="floating-menu-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </span>
        <span class="floating-tip" aria-hidden="true">Open sidebar</span>
      </button>
      <button id="files-expand" class="floating-toggle floating-right" type="button" title="Show files (Ctrl+B)" aria-label="Show files" aria-controls="sidebar" aria-expanded="false">◧</button>
      <div id="drawer-backdrop" class="drawer-backdrop" aria-hidden="true"></div>

      <main id="transcript" class="transcript" aria-live="polite"></main>

      <div id="sidebar-resizer" class="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Resize panels" tabindex="0"></div>

      <footer class="footer">
        <div id="status" class="status" aria-live="polite"></div>
        <form id="composer" class="composer">
          <div id="attachments" class="attachments hidden" aria-label="Attachments"></div>
          <span class="prompt-glyph" aria-hidden="true">›</span>
          <textarea
            id="prompt"
            class="prompt"
            rows="1"
            placeholder="Enter send · Shift+Enter newline"
            autocomplete="off"
            autocapitalize="sentences"
            spellcheck="true"
            aria-label="Message"></textarea>
          <button id="attach" class="icon-button" type="button" title="Attach files" aria-label="Attach files">+</button>
          <button id="interrupt" class="icon-button stop hidden" type="button" title="Interrupt (Esc)" aria-label="Interrupt">■</button>
          <button id="send" class="send" type="submit">Send <kbd>⏎</kbd></button>
        </form>
      </footer>

      <aside id="sidebar" class="sidebar" aria-label="Session information"></aside>
    </div>
  </div>

  <div id="alerts" class="alerts" role="alert" aria-live="assertive" hidden></div>

  <section id="plugin-host" class="plugin-host" aria-label="Application panels" hidden></section>

  <div id="toasts" class="toasts" aria-live="assertive"></div>

  <input id="file-upload" type="file" multiple hidden>
  <input id="attachment-upload" type="file" multiple hidden>


  <div id="workflow-zoom" class="wf-zoom-overlay hidden" role="dialog" aria-modal="true" aria-label="Workflow graph"></div>

  <div id="file-menu" class="file-context-menu" role="menu" aria-label="File actions" hidden>
    <button type="button" role="menuitem" data-file-edit>Edit as text</button>
    <button type="button" role="menuitem" data-file-preview hidden>Preview</button>
    <button type="button" role="menuitem" data-file-download>Download…</button>
  </div>

  <div id="login" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="login-title">
    <form id="login-form" class="login-card">
      <h1 id="login-title"><span class="brand-mark"><svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><circle cx="12" cy="12" r="4.25"/><path d="M12 3.5v4.25M12 16.25v4.25M3.5 12h4.25M16.25 12h4.25"/></svg></span> <span class="brand-name">GEWU</span></h1>
      <p class="login-copy">This GUI requires an access token. Ask whoever started <code>gewu-gui</code> for it.</p>
      <label class="login-label" for="token">access token</label>
      <input id="token" class="login-input" type="password" autocomplete="current-password" required>
      <p id="login-error" class="login-error hidden"></p>
      <button class="login-submit" type="submit">Connect</button>
    </form>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
