[package]
name = "gewu-gateway"
version = "0.1.0"
edition = "2024"
description = "GeWu Gateway - background orchestration, scheduler, jobs, and catalog API"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
chrono = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
cron = "0.13"
dirs = "6"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-native-tls"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

gewu-cli = { path = "../gewu-cli" }
gewu-core = { path = "../gewu-core" }
gewu-providers = { path = "../gewu-providers" }
gewu-runtime = { path = "../gewu-runtime" }
gewu-storage = { path = "../gewu-storage" }

[[bin]]
name = "gewu-gateway"
path = "src/main.rs"
