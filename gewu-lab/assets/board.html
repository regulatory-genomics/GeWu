<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'none'">
  <title>GeWu Lab</title>
  <link rel="stylesheet" href="/board.css">
  <script src="/board.js" defer></script>
</head>
<body>
  <header><span>GeWu Lab</span><button id="projects" hidden>Back to projects</button></header>
  <main>
    <h1 id="title" tabindex="-1">Project board</h1>
    <p id="notice" role="status">Loading projects…</p>
    <form id="login" hidden>
      <label for="token">Access token</label>
      <input id="token" type="password" required>
      <button type="submit">Connect</button>
    </form>
    <div id="board"></div>
    <section aria-labelledby="chat-title">
      <h2 id="chat-title">Chat with Lab</h2>
      <div id="chat-log" role="log"></div>
      <p id="chat-status" role="status">Chat is unavailable until connected.</p>
      <form id="chat-form">
        <label for="chat-text">Message to Lab</label>
        <textarea id="chat-text" maxlength="4096" required disabled></textarea>
        <button id="chat-send" type="submit" disabled>Send</button>
      </form>
    </section>
  </main>
</body>
</html>
