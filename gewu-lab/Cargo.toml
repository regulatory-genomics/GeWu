[package]
name = "gewu-lab"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
gewu-core = { path = "../gewu-core" }
gewu-server = { path = "../gewu-server" }
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "time"] }

[dev-dependencies]
tokio-tungstenite = "0.28"
