[package]
name = "gewu-client"
version = "0.1.0"
edition = "2024"

[dependencies]
gewu-protocol = { path = "../gewu-protocol" }
anyhow = "1.0"
base64 = "0.22"
futures = "0.3.32"
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
tokio-tungstenite = "0.28"
tracing = "0.1"

[dev-dependencies]
gewu-core = { path = "../gewu-core" }
serde = { version = "1.0", features = ["derive"] }
async-trait = "0.1"
async-stream = "0.3.6"
schemars = "0.8"
