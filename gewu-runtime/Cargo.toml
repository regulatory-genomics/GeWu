[package]
name = "gewu-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
gewu-core = { path = "../gewu-core" }
gewu-graph = { path = "../gewu-graph" }
gewu-tools = { path = "../gewu-tools" }
gewu-storage = { path = "../gewu-storage" }
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-native-tls"] }
uuid = { version = "1.10", features = ["v4"] }
futures = "0.3.32"
async-stream = "0.3.6"
schemars = "0.8"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json"] }
dirs = "6.0.0"
chrono = { version = "0.4", features = ["clock"] }

[dev-dependencies]
tempfile = "3"
