[package]
name = "gewu-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
gewu-core = { path = "../gewu-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"
schemars = "0.8"
tokio = { version = "1", features = ["full"] }
