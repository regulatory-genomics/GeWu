[package]
name = "gewu-cli"
version = "0.1.0"
edition = "2024"
description = "Command-line interface and session orchestration for the GeWu agent framework"

[dependencies]
gewu-core = { path = "../gewu-core" }
gewu-graph = { path = "../gewu-graph" }
gewu-providers = { path = "../gewu-providers" }
gewu-tools = { path = "../gewu-tools" }
gewu-storage = { path = "../gewu-storage" }
gewu-runtime = { path = "../gewu-runtime" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json-strip-comments = "3.1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
dotenvy = "0.15"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-native-tls"] }
uuid = { version = "1.10", features = ["v4"] }
dirs = "6.0.0"
futures = "0.3.32"
schemars = "0.8"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
