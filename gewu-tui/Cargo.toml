[package]
name = "gewu-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
gewu-client = { path = "../gewu-client" }
gewu-protocol = { path = "../gewu-protocol" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3.32"
ratatui = "0.30"
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tui-markdown = { version = "0.3", features = ["highlight-code"] }

[dev-dependencies]
gewu-core = { path = "../gewu-core" }
